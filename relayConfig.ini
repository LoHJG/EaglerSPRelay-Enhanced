# ============================================================================
#  EaglerSPRelay configuration / 配置文件
#
#  Lines beginning with # are ignored. Delete any key and it will be restored
#  with its default value on the next start.
#  以 # 开头的行会被忽略。删除任意一项后，下次启动会以默认值补回。
#
#  This file is written as UTF-8, so the comments below stay readable no matter
#  what locale the machine uses. / 本文件以 UTF-8 写入，不受系统区域设置影响。
# ============================================================================

[EaglerSPRelay]

# Address and port to listen on. TCP serves WebSocket, UDP serves the STUN server.
# 监听地址与端口。TCP 用于 WebSocket，UDP 用于 STUN 服务。
# 0.0.0.0 = all interfaces / 所有网卡
address: 0.0.0.0
port: 6699

# Join code settings. Length and the alphabet used to generate world codes.
# 加入码设置：长度，以及生成世界码所用的字符集。
code-length: 5
code-chars: abcdefghijklmnopqrstuvwxyz0123456789
# Allow uppercase letters in codes. Note that codes are case-insensitive when a
# client joins, unless this is enabled.
# 是否允许加入码包含大写字母。未启用时，客户端输入加入码不区分大小写。
code-mix-case: false

# Maximum simultaneous connections from a single IP address.
# 单个 IP 允许的最大同时连接数。
connections-per-ip: 128

# Ping (server list poll) rate limit. Period in seconds, limit is the number of
# pings allowed per period. Exceeding the lockout limit locks the IP out for
# lockout-duration seconds. / 探针（服务器列表查询）限流：period 为周期秒数，
# limit 为周期内允许次数，超过 lockout-limit 则封禁 lockout-duration 秒。
ping-ratelimit-enable: true
ping-ratelimit-period: 256
ping-ratelimit-limit: 128
ping-ratelimit-lockout-limit: 192
ping-ratelimit-lockout-duration: 300

# Maximum number of simultaneously open LAN worlds from a single IP.
# 单个 IP 允许同时开放的最大局域网世界数量。
worlds-per-ip: 32

# World creation rate limit. Same units as the ping limit above.
# 创建世界限流，单位与上面的探针限流相同。
world-ratelimit-enable: true
world-ratelimit-period: 192
world-ratelimit-limit: 32
world-ratelimit-lockout-limit: 48
world-ratelimit-lockout-duration: 600

# Semicolon separated list of allowed web origins. Empty = allow all.
# Supports a leading * wildcard, for example "*.example.com".
# 允许的网页来源白名单，用分号分隔。留空表示不限制。
# 支持前置 * 通配，例如 "*.example.com"。
origin-whitelist: 

# Trust the X-Real-IP style header set by a reverse proxy. Only enable this when
# the relay is genuinely behind a proxy, otherwise clients can spoof their IP and
# bypass the bans and the per-IP limits above.
# 是否信任反向代理设置的 X-Real-IP 类请求头。只有在确实位于代理后方时才可开启，
# 否则客户端可以伪造 IP，绕过封禁与上面的单 IP 限制。
enable-real-ip-header: false
real-ip-header-name: X-Real-IP

# Answer "which worlds are open" queries at all. When false, the query returns an empty list.
# 是否响应"有哪些世界开放"的查询。设为 false 时查询返回空列表。
show-local-worlds: true

# Which worlds a player sees in the shared-world list.
# 玩家在共享世界列表中能看到哪些世界。
#
#   global - everyone sees every open world (default)
#   local  - players only see worlds opened from the same IP address, which is how the
#            client originally behaved. Useful to keep a relay's worlds private to each NAT.
#   global - 所有人可见全部开放的世界（默认）
#   local  - 只能看到与自己同 IP 开放的世界，即客户端原本的行为。
#            适合让中继上的世界按网络出口互相隔离。
world-list-scope: global

# ---------------------------------------------------------------------------
#  TLS / wss
# ---------------------------------------------------------------------------
# When enabled, the relay serves TLS ONLY, on the same port as above.
# Plaintext ws:// is refused, so every client must use wss://.
# 启用后，中继在同一端口上只提供 TLS，明文 ws:// 会被拒绝，
# 所有客户端都必须使用 wss:// 连接。
wss-enable: false

# Certificate files, relative to this file. Place them next to this config.
# 证书文件，路径相对于本文件所在目录。
#
# wss-key-file is a PEM PKCS#8 private key (what Let's Encrypt / acme.sh emit),
# and wss-cert-file is the matching PEM chain. A fullchain file works as-is; the
# chain is reordered automatically.
# wss-key-file 为 PEM 格式的 PKCS#8 私钥（Let's Encrypt / acme.sh 的产物），
# wss-cert-file 为对应的 PEM 证书链。fullchain 文件可直接使用，程序会自动重排顺序。
#
# To use a PKCS12 or JKS keystore instead, leave wss-key-file EMPTY and point
# wss-cert-file at the .p12 / .jks file.
# 若要改用 PKCS12 或 JKS 密钥库，请将 wss-key-file 留空，
# 并把 wss-cert-file 指向 .p12 / .jks 文件。
wss-cert-file: cert.pem
wss-key-file: key.pem

# Password for an encrypted private key, or for the keystore. Empty = none.
# 加密私钥或密钥库的密码。留空表示无密码。
wss-key-password: 

# ---------------------------------------------------------------------------
#  Built-in STUN server / 内置 STUN 服务器
# ---------------------------------------------------------------------------
# Runs over UDP on the SAME port number as the WebSocket listener (UDP and TCP
# do not collide) and is advertised FIRST in the ICE list, ahead of relays.txt.
# 通过 UDP 监听，端口号与 WebSocket 相同（UDP 与 TCP 互不冲突），
# 并在 ICE 列表中排在 relays.txt 的前面，优先被客户端使用。
stun-enable: true

# Address to advertise for the built-in STUN server. Leave empty to derive it:
#   1. the address above, when it is a specific IP rather than 0.0.0.0
#   2. otherwise, the hostname the client actually connected with
# Set this explicitly when UDP is forwarded to a different port, or when a
# reverse proxy rewrites the Host header.
# 内置 STUN 对外公布的地址。留空则自动推导：
#   1. 上面的 address 是具体 IP（非 0.0.0.0）时，直接使用它
#   2. 否则使用客户端实际连接所用的域名
# 当 UDP 转发到不同端口，或反向代理改写了 Host 头时，请在此显式指定。
# Accepts "host" or "host:port"; the latter also overrides the advertised port.
# 可写为 "host" 或 "host:port"，后者会一并覆盖公布的端口。
stun-external-address: 

# Also answer legacy RFC 3489 clients that omit the magic cookie. Leave this off
# unless you specifically need it; a legacy client is answered without the
# XOR-MAPPED-ADDRESS attribute so that strict implementations accept it.
# 是否额外响应不带 magic cookie 的旧版 RFC 3489 客户端。除非确有需要，否则保持关闭；
# 对旧版客户端的响应会省略 XOR-MAPPED-ADDRESS 属性，以兼容严格的实现。
stun-rfc3489-legacy: false

# Text shown to clients in the server list. Keep it ASCII if possible: the packet
# protocol carries one byte per character, so non-ASCII text is truncated.
# 在客户端服务器列表中显示的说明文字。建议只使用 ASCII 字符：
# 协议按每字符一字节传输，非 ASCII 文本会被截断。
server-comment: Eags. Public LAN Relay
